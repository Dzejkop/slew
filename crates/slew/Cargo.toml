[package]
name = "slew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A suspendable Lua interpreter with strict, embedder-controlled execution budgets"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/slew"
readme = "README.md"
keywords = ["lua", "interpreter", "vm", "sandbox", "embedding"]
categories = ["development-tools", "emulators"]

# `cargo test` only *compiles* examples by default; run the TUI example's
# channel/prompt tests as part of the normal test target.
[[example]]
name = "tui"
test = true

[dependencies]
reedline = { workspace = true, optional = true }
thiserror.workspace = true
strum.workspace = true

[features]
default = ["repl", "fs"]
repl = ["dep:reedline"]
# Built-in std::fs reader adapter (`Lua::set_fs_file_reader`). The core never
# touches the filesystem itself; disable this for fs-less targets.
fs = []

[[bin]]
name = "slew"
path = "src/bin/repl.rs"
required-features = ["repl"]

[dev-dependencies]
ratatui.workspace = true
test-case.workspace = true
color-eyre.workspace = true

[lints]
workspace = true
