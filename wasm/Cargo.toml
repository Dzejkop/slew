[package]
name = "slew-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser (WebAssembly) bindings for slew, the suspendable Lua 5.4 interpreter"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slew = { path = "..", default-features = false }
wasm-bindgen = "=0.2.104"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
