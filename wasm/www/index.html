<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>slew — suspendable Lua in the browser</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #2b313a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #7ee787;
    --warn: #e3b341;
    --error: #ff7b72;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header { padding: 18px 24px 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; font-family: var(--mono); }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px 24px 24px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  select, input, button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  select, input { padding: 4px 8px; }
  select { max-width: 220px; }
  input[type="number"] { width: 110px; }
  button { padding: 5px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover:not(:disabled) { background: #2b7fff; border-color: #2b7fff; }
  label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }

  /* Editor: a transparent textarea over a coloured copy, with a line gutter
     pinned to the left. The textarea owns scrolling; the layers follow it. */
  .editor { position: relative; flex: 1; min-height: 340px; overflow: hidden; background: var(--panel); }
  .editor pre, .editor textarea {
    margin: 0;
    border: 0;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 20px;
    tab-size: 2;
    white-space: pre;
  }
  #gutter {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 64px;
    padding: 12px 8px 12px 0;
    overflow: hidden;
    text-align: right;
    color: #6e7681;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }
  #highlight {
    position: absolute;
    inset: 0;
    padding: 12px 12px 12px 64px;
    overflow: hidden;
    color: var(--text);
    z-index: 1;
    pointer-events: none;
  }
  #src {
    position: absolute;
    inset: 0;
    padding: 12px 12px 12px 64px;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    overflow: auto;
    z-index: 3;
    resize: none;
    outline: none;
  }
  #src::selection { background: rgba(56, 139, 253, 0.35); }
  .line { min-height: 20px; }
  .line.exec { background: rgba(227, 179, 65, 0.15); }
  .gln.exec { color: var(--warn); font-weight: 600; }
  .tok-comment { color: #8b949e; font-style: italic; }
  .tok-string { color: #a5d6ff; }
  .tok-number { color: #79c0ff; }
  .tok-keyword { color: #ff7b72; }
  .tok-builtin { color: #d2a8ff; }
  .tok-op { color: #ffa657; }
  .status {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
  }
  .badge { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.idle { color: var(--muted); }
  .badge.done { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .badge.suspended { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .badge.error { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); }
  .console-head { padding: 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  pre#out {
    flex: 1;
    margin: 0;
    padding: 12px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 13px;
    white-space: pre-wrap;
  }
  #result {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    min-height: 20px;
    white-space: pre-wrap;
  }
  #result.error { color: var(--error); }
</style>
</head>
<body>
<header>
  <h1>slew<span>·</span></h1>
  <p>
    A suspendable Lua 5.4 interpreter. Every run stops after its fuel budget,
    so an infinite loop suspends instead of freezing the page.
  </p>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <select id="examples" title="load an example"></select>
      <label>fuel <input id="fuel" type="number" min="1" step="1000" value="100000" /></label>
      <button id="run" class="primary" disabled>Run</button>
      <button id="resume" disabled>Resume</button>
      <button id="stop" disabled>Stop</button>
      <label><input id="auto" type="checkbox" /> auto-step</label>
    </div>
    <div class="editor">
      <pre id="gutter" aria-hidden="true"></pre>
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocapitalize="off" wrap="off"></textarea>
    </div>
    <div class="status">
      <span id="state" class="badge idle">loading…</span>
      <span id="location"></span>
      <label>watch <input id="watch" size="6" placeholder="global" /></label>
      <span id="watch-value"></span>
      <span id="memory"></span>
    </div>
  </section>
  <section class="panel">
    <div class="console-head">Output</div>
    <pre id="out"></pre>
    <div id="result"></div>
  </section>
</main>
<script type="module">
import init, { Session } from "./pkg/slew_wasm.js";
import { highlight } from "./lua-highlight.js";

const $ = (id) => document.getElementById(id);
const srcEl = $("src");
const fuelEl = $("fuel");
const watchEl = $("watch");
const runBtn = $("run");
const resumeBtn = $("resume");
const stopBtn = $("stop");
const autoEl = $("auto");
const outEl = $("out");
const resultEl = $("result");
const stateEl = $("state");
const locationEl = $("location");
const watchValueEl = $("watch-value");
const memoryEl = $("memory");
const examplesEl = $("examples");
const highlightEl = $("highlight");
const gutterEl = $("gutter");

const EXAMPLES = [
  [
    "runaway loop (suspend me)",
    `-- Runs forever, but each budget-limited step returns to the browser.
-- 'n' is a global so the watch box can show it grow.
n = 0
while true do
  n = n + 1
end`,
    "n",
  ],
  [
    "coroutines: fibonacci",
    `local gen = coroutine.wrap(function()
  local a, b = 0, 1
  while true do
    coroutine.yield(a)
    a, b = b, a + b
  end
end)

-- 'fib' is a global so the watch box can show the sequence.
fib = {}
for i = 1, 15 do fib[#fib + 1] = gen() end
print(table.concat(fib, " "))`,
    "fib",
  ],
  [
    "metatables: accounts",
    `local Account = {}
Account.__index = Account

function Account.new(owner, balance)
  return setmetatable({ owner = owner, balance = balance }, Account)
end

function Account:deposit(amount)
  self.balance = self.balance + amount
  return self.balance
end

local a = Account.new("ada", 100)
a:deposit(41)
print(a.owner, "balance", a:deposit(1))`,
    "",
  ],
  [
    "pcall: errors are values",
    `local ok, err = pcall(function()
  error("kaboom")
end)

print("pcall ->", ok, err)
print("still running")`,
    "",
  ],
];

const byName = new Map(EXAMPLES.map(([name, code, watch]) => [name, { code, watch }]));
for (const [name] of EXAMPLES) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  examplesEl.append(option);
}

let session = null;
let auto = false;
let timer = null;
let execLine = null;

function render() {
  const { code, gutter } = highlight(srcEl.value, execLine);
  highlightEl.innerHTML = code;
  gutterEl.innerHTML = gutter;
  syncScroll();
}

function syncScroll() {
  highlightEl.scrollTop = srcEl.scrollTop;
  highlightEl.scrollLeft = srcEl.scrollLeft;
  gutterEl.scrollTop = srcEl.scrollTop;
}

/// `Session.location()` renders as `chunk:12`; pull out the line.
function parseLocation(location) {
  const match = location && /:(\d+)$/.exec(location);
  return match ? Number(match[1]) : null;
}

function setState(label, kind) {
  stateEl.textContent = label;
  stateEl.className = `badge ${kind}`;
}

function setResult(text, isError = false) {
  resultEl.textContent = text;
  resultEl.classList.toggle("error", isError);
}

function drain() {
  if (!session) return;
  const text = session.take_output();
  if (text) {
    outEl.textContent += text;
    outEl.scrollTop = outEl.scrollHeight;
  }
}

function refresh() {
  if (!session) return;
  const suspended = session.is_suspended();
  resumeBtn.disabled = !suspended;
  stopBtn.disabled = !suspended;
  runBtn.textContent = suspended ? "Restart" : "Run";
  const location = suspended ? session.location() : null;
  locationEl.textContent = location ?? "";
  execLine = parseLocation(location);
  const name = watchEl.value.trim();
  watchValueEl.textContent = name ? `${name} = ${session.global(name) ?? "nil"}` : "";
  memoryEl.textContent = `${session.memory_used()} B`;
  if (suspended) setState("suspended", "suspended");
  render();
}

function step(kind) {
  if (!session) return;
  try {
    const fuel = Math.max(1, Math.floor(Number(fuelEl.value) || 1));
    const status = kind === "run" ? session.run(srcEl.value, fuel) : session.resume(fuel);
    drain();
    if (status === "done") {
      setState("done", "done");
      setResult(session.result() ? `→ ${session.result()}` : "");
    } else if (status === "suspended") {
      setState("suspended", "suspended");
      setResult("");
    }
  } catch (e) {
    drain();
    setState("error", "error");
    setResult(`! ${e}`, true);
  }
  refresh();
}

function schedule() {
  if (!auto || !session?.is_suspended()) return;
  timer = setTimeout(() => {
    if (!auto) return;
    step("resume");
    schedule();
  }, 0);
}

runBtn.addEventListener("click", () => {
  outEl.textContent = "";
  setResult("");
  step("run");
  schedule();
});

resumeBtn.addEventListener("click", () => {
  step("resume");
  schedule();
});

stopBtn.addEventListener("click", () => {
  auto = false;
  autoEl.checked = false;
  clearTimeout(timer);
  session.abort();
  setState("idle", "idle");
  refresh();
});

autoEl.addEventListener("change", () => {
  auto = autoEl.checked;
  if (auto) schedule();
  else clearTimeout(timer);
});

examplesEl.addEventListener("change", () => {
  const example = byName.get(examplesEl.value);
  if (!example) return;
  auto = false;
  autoEl.checked = false;
  clearTimeout(timer);
  if (session) session.abort();
  outEl.textContent = "";
  setResult("");
  setState("idle", "idle");
  srcEl.value = example.code;
  watchEl.value = example.watch;
  refresh();
});

watchEl.addEventListener("input", refresh);

srcEl.addEventListener("keydown", (event) => {
  if (event.key === "Tab") {
    event.preventDefault();
    const { selectionStart, selectionEnd, value } = srcEl;
    srcEl.value = value.slice(0, selectionStart) + "  " + value.slice(selectionEnd);
    srcEl.selectionStart = srcEl.selectionEnd = selectionStart + 2;
    render();
  }
});

srcEl.addEventListener("input", render);
srcEl.addEventListener("scroll", syncScroll, { passive: true });

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
    event.preventDefault();
    outEl.textContent = "";
    setResult("");
    step("run");
    schedule();
  }
});

try {
  await init();
  session = new Session();
  srcEl.value = EXAMPLES[0][1];
  watchEl.value = EXAMPLES[0][2];
  examplesEl.value = EXAMPLES[0][0];
  runBtn.disabled = false;
  setState("ready", "idle");
  refresh();
} catch (e) {
  setState("load failed", "error");
  setResult(String(e), true);
}
</script>
</body>
</html>
